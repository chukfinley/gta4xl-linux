# Tablet defaults. /etc/environment selects the Panfork GL driver. With it, 1080p30 H.264 plays
# without dropped frames. The MFC decoder does not work with ffmpeg, see docs/gta4xl.md.
vo=gpu
gpu-context=wayland
profile=fast
hwdec=no
vd-lavc-fast=yes
ao=pipewire
fullscreen=yes
keep-open=yes
save-position-on-quit=yes

# uosc draws the controls
osc=no
osd-bar=no
border=no
