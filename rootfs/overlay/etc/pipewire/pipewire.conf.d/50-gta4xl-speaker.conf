# Fixed sink for the speaker and the headphone jack. gta4xl-audio selects the output.
# Priority is below BlueZ, so a connected headset takes the default output.
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "gta4xl-speaker"
            node.description       = "Lautsprecher / Kopfhörer"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:0,0"
            api.alsa.period-size   = 1024
            api.alsa.period-num    = 8
            api.alsa.headroom      = 1024
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            priority.session       = 800
            priority.driver        = 800
            device.icon-name       = "audio-speakers"
            session.suspend-timeout-seconds = 3
        }
    }
]
