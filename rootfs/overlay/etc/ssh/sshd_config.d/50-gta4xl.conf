# Normal sshd over Tailscale. Tailscale SSH stays off: the default tailnet policy needs an
# interactive check for it. Password login is on for devices in the tailnet, root takes keys only.
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
# SSH only from the tailnet
AllowUsers *@100.64.0.0/10 *@127.0.0.1
